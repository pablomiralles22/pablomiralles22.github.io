# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you: 
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Pablo Miralles
email: pablo.miralles [at] upm.es
description: >- # this means to ignore newlines until "baseurl:"
  Personal website of Pablo Miralles, Mathematics and Computer Science graduate, PhD student in Deep Learning at Technical University of Madrid
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://pablomirallesg.com" # the base hostname & protocol for your site, e.g. http://example.com

# Social settings
x_username: p_miralles_
github_username:  pablomiralles22

# Build settings
theme: jekyll-bear-theme
plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll/scholar
  - jekyll-figure
  - jekyll-imagemagick
  - jekyll-sitemap

whitelist:
  - jekyll-redirect-from

imagemagick:
  enabled: true
  widths:
    - 480
    - 800
    - 1400
  input_directories:
    - assets/img/
  input_formats:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".tiff"
    - ".gif"
    - ".pdf"
  output_formats:
    webp: "-quality 85"


# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

markdown: kramdown
kramdown:
  input: GFM
highlighter: rouge

compress_html:
  clippings: all
  comments: [""]
  endings: [html, head, body, li, dt, dd, rt, rp, optgroup, option, colgroup, caption, thead, tbody, tfoot, tr, td, th]
  profile: false
  blanklines: false
  ignore:
    envs: []

# sass:
#   sass_dir: css
#   style:    compressed

collections:
  notes:
    output: true
    permalink: /notes/:slug/
    sort_by: date

  my_tags:
    output: true
    permalink: /tagged/:slug/

defaults:
  - scope:
      path: "pages"
    values:
      permalink: /:basename/
  - scope:
      path: ""
      type: my_tags
    values:
      layout: tagged

# baseurl: ""
permalink: /blog/:slug
timezone: Europe/Madrid
future: false

exclude:
- README.md
- LICENSE.md

exclude: [vendor]

# Add general links to site pages here
links:
  - name: Blog
    url: /blog
    new_tab: false
  - name: Notes
    url: /notes
    new_tab: false
  - name: Resume
    url: /assets/cv.pdf
    new_tab: true

# Add links for more focus here
special_links:
  - name: Publications
    url: https://scholar.google.com/citations?user=l538kF8AAAAJ&hl=en
    new_tab: true

scholar:
  style: apa