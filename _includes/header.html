<!DOCTYPE html>
<html lang="en" dir="ltr">
    
<header>
    <h2 class="title">{{ site.title }}</h2>
    <nav>
        <p>
            <a href="{{ "/" | relative_url }}">Home</a> 
        
            {% for link in site.links %}
                <a href="{{ link.url | relative_url }}" {% if link.new_tab %}target="_blank"{% endif %}>{{ link.name }}</a>
            {% endfor %}
            
            {% for link in site.special_links %}
                <a href="{{ link.url }}" {% if link.new_tab %}target="_blank"{% endif %}>[{{ link.name }}]</a>
            {% endfor %}
        </p>
    </nav>
</header>
